<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Manipolare il DOM</title>
		<link rel="stylesheet" type="text/css" href="assets/css/style.css" />
		<script type="module" src="assets/js/script.js"></script>
	</head>
	<body>
		<header>
			<h1 id="title">Manipolare il dom</h1>
		</header>

		<main>
			<ul id="myList">
				<li class="myListLi">Elemento 1</li>
				<li class="myListLi">Elemento 2</li>
				<li class="myListLi">Elemento 3</li>
				<li class="myListLi">Elemento 4</li>
				<li class="myListLi">Elemento 5</li>
			</ul>

			<table>
				<thead>
					<tr>
						<th>ID elemento</th>
						<th>Nome elemento</th>
					</tr>
				</thead>
                <tbody id="myTable"></tbody>
			</table>

			<p id="firstPar"></p>

			<form id="myForm">
				<input type="number" id="num1" name="num1" value="0" />
				<select id="mySelect">
					<option value="FE">Front-End</option>
					<option value="BE">Back-End</option>
					<option value="FS">Full Stack</option>
				</select>
			</form>
			<h3 id="lightning" class="light">Mi illumina JavaScript</h3>
			<button type="button" id="myToggle">accendi/spegni</button>
		</main>
	</body>
</html>
