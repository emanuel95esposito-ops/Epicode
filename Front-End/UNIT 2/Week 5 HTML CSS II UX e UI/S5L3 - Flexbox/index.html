<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Struttura flexbox</title>
		<link rel="stylesheet" type="text/css" href="assets/css/style.css" />
	</head>
	<body>
		<h1>FLEXBOX</h1>

        <a href="struttura.html"><h3>Esempio di struttura flexbox complessa</h3></a>

		<hr />

		<h2>JUSTIFY-CONTENT</h2>

		<div class="container">
			<div class="justify">
				<div><h4>1</h4></div>
				<div><h4>2</h4></div>
				<div><h4>3</h4></div>
				<div><h4>4</h4></div>
			</div>
		</div>

		<hr />

		<h2>ALIGN-ITEMS</h2>

		<div class="container">
			<div class="align">
				<div>
					<h4><img src="assets/img/EPICODE-pitto-color.png" /></h4>
				</div>
				<div><h1>2</h1></div>
				<div><h6>3</h6></div>
				<div><h3>4</h3></div>
			</div>
		</div>

		<hr />

		<h2>ALLINEAMENTO COMBINATO</h2>

		<div class="container">
			<div class="combine">
				<div><h4>1</h4></div>
				<div><h1>2</h1></div>
				<div><h6>3</h6></div>
				<div><h3>4</h3></div>
			</div>
		</div>

		<hr />

		<h2>WRAP, GAP, ORDER</h2>

		<div class="container">
			<div class="multiple">
				<div><h4>1</h4></div>
				<div><h4>2</h4></div>
				<div><h4>3</h4></div>
				<div><h4>4</h4></div>
			</div>
		</div>

		<div class="container">
			<div class="siteLayout">
				<div><h2>MAIN</h2></div>
				<div><h3>NEWS</h3></div>
				<div><h4>ASIDE</h4></div>
			</div>
		</div>

		<hr />

		<h2>PROPRIETÀ CHILDREN: GROW, SHRINK, BASIS, ALIGN-SELF</h2>

		<div class="container">
			<div class="children">
				<div><h4>1</h4></div>
				<div><h4>2</h4></div>
				<div><h4>3</h4></div>
				<div><h4>4</h4></div>
			</div>
		</div>

		<div class="container">
			<div class="flexProperty">
				<div><h4>1</h4></div>
				<div><h4>2</h4></div>
				<div><h4>3</h4></div>
				<div><h4>4</h4></div>
			</div>
		</div>

        <div class="container">
			<div class="children2">
				<div><h4>1</h4></div>
				<div><h4>2</h4></div>
				<div><h4>3</h4></div>
				<div><h4>4</h4></div>
			</div>
		</div>
	</body>
</html>
