<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Roulette JavaScript</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>
		<script type="module" src="assets/js/script.js"></script>
	</head>
	<body>
		<header class="d-flex justify-content-center bg-dark text-light">
			<h1>ROULETTE JAVASCRIPT per due giocatori</h1>
		</header>
		<hr />
		<main class="container">
			<h2>SCOMMETTI</h2>
			<div class="join">
				<form>
					<div class="row">
						<div class="col-md-6">
							<label for="player1" class="form-label"
								>GIOCATORE 1</label
							>
							<input
								type="number"
								id="player1"
								class="form-control"
								min="1"
								max="36"
							/>
						</div>
						<div class="col-md-6">
							<label for="player2" class="form-label"
								>GIOCATORE 2</label
							>
							<input
								type="number"
								id="player2"
								class="form-control"
								min="1"
								max="36"
							/>
						</div>
					</div>
					<button
						type="submit"
						class="btn btn-primary border rounded-3 mt-3"
					>
						ESTRAI
					</button>
					<button
						type="reset"
						class="btn btn-primary border rounded-3 mt-3"
						id="resetForm"
					>
						RICOMINCIA
					</button>
				</form>
			</div>
			<div class="d-flex justify-content-center flex-column">
				<h3 id="verify"></h3>
				<h3 id="winner"></h3>
			</div>
		</main>
	</body>
</html>
