<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno I</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script type="module" src="./assets/js/script.js"></script>
</head>

<body>

  <header class="site-header sticky-top">
    <h1>La mia libreria</h1>
    <p>Aggiungi i tuoi libri e segnali come letti.</p>
  </header>

  <main class="container library-container py-4">

    <section class="bg-white rounded shadow-sm p-4 mb-4">
      <h2 class="h4 fw-bold mb-3">Area riservata</h2>

      <div id="auth-box"></div>
    </section>

    <section id="profilo-section" class="bg-white rounded shadow-sm p-4 mb-4" hidden>
      <h2 class="h4 fw-bold mb-3">Il tuo profilo</h2>

      <div id="profilo-contenuto"></div>
    </section>

    <section class="cerca-section bg-white rounded shadow-sm p-4 mb-4">

      <h2 class="h4 fw-bold mb-3">Cerca</h2>

      <div class="campo">
        <label for="cerca" class="form-label">Titolo o autore</label>
        <input type="text" id="cerca" class="form-control" placeholder="es. harari, tolkien, sapiens">
      </div>

      <div id="spinner" class="spinner my-3" hidden>
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        Caricamento in corso...
      </div>

      <div id="errore" class="alert alert-danger mt-3" hidden></div>

      <ul id="risultati" class="risultati list-unstyled mt-3 mb-0"></ul>

    </section>


    <section class="form-section bg-white rounded shadow-sm p-4 mb-4">
      <h2 class="h4 fw-bold mb-3">Aggiungi un libro</h2>

      <form id="aggiungi-libro" class="form">

        <div class="mb-3">
          <label for="titolo" class="form-label fw-semibold">Titolo</label>
          <input type="text" id="titolo" name="titolo" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="autore" class="form-label fw-semibold">Autore</label>
          <input type="text" id="autore" name="autore" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="anno" class="form-label fw-semibold">Anno</label>
          <input type="number" id="anno" name="anno" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="formato" class="form-label fw-semibold">Formato</label>
          <select id="formato" name="formato" class="form-select">
            <option value="cartaceo">Cartaceo</option>
            <option value="digitale">Digitale</option>
            <option value="audio">Audio</option>
          </select>
        </div>

        <div class="mb-3" id="campo-dimensione" hidden>
          <label for="dimensioneMb" class="form-label fw-semibold">Dimensione MB</label>
          <input type="number" id="dimensioneMb" name="dimensioneMb" class="form-control" step="0.1" min="0.1">
        </div>

        <div class="mb-3" id="campo-durata" hidden>
          <label for="durataMinuti" class="form-label fw-semibold">Durata (minuti)</label>
          <input type="number" id="durataMinuti" name="durataMinuti" class="form-control" min="1" step="1">
        </div>

        <button type="submit" class="btn btn-primary">Aggiungi</button>

      </form>
    </section>

    <section class="lista-section">

      <div class="lista-header d-flex justify-content-between align-items-center mb-2 gap-2">
        <h2 class="h5 fw-bold mb-0">I tuoi libri (<span id="contatore">0</span>)</h2>

        <div class="d-flex gap-2">
          <button type="button" id="esporta-json" class="btn btn-outline-primary btn-sm">
            Esporta
          </button>

          <button type="button" id="svuota-tutto" class="btn btn-outline-danger btn-sm">
            Svuota tutto
          </button>
        </div>
      </div>

      <p class="info-storage text-muted fst-italic small mb-3">
        I libri sono salvati nel browser e sopravvivono al refresh.
      </p>

      <div class="filtri d-flex gap-2 mb-3">
        <button type="button" class="btn btn-primary btn-sm" data-filtro="tutti">
          Tutti
        </button>

        <button type="button" class="btn btn-outline-secondary btn-sm" data-filtro="letti">
          Letti
        </button>

        <button type="button" class="btn btn-outline-secondary btn-sm" data-filtro="da-leggere">
          Da leggere
        </button>
      </div>

      <div class="d-flex align-items-center gap-2 mb-3">
        <label for="ordina-libri" class="form-label mb-0">
          Ordina per:
        </label>

        <select id="ordina-libri" class="form-select form-select-sm w-auto">
          <option value="titolo">Titolo</option>
          <option value="anno">Anno</option>
        </select>
      </div>

      <ul id="lista-libri" class="list-unstyled mb-0">
        <!-- popolato da JavaScript -->
      </ul>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>

</body>

</html>
