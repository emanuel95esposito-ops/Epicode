<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>
		<script type="module" src="assets/js/script.js"></script>
	</head>
	<body>
		<div class="container text-center">
			<h1>Introduzione alle classi</h1>
		</div>

		<div class="container">
			<h2>Form di iscrizione</h2>
			<form id="register">
				<div class="container">
					<div class="row">
						<div class="col-3">
							<label for="newName" class="form-label">NOME</label>
							<input
								type="text"
								id="newName"
								class="form-control"
							/>
						</div>
						<div class="col-3">
							<label for="newSurname" class="form-label"
								>COGNOME</label
							>
							<input
								type="text"
								id="newSurname"
								class="form-control"
							/>
						</div>
						<div class="col-3 mb-3">
							<label for="newAge" class="form-label">ETÀ</label>
							<input
								type="number"
								id="newAge"
								class="form-control"
							/>
						</div>
						<div class="col-3">
							<label for="newFrequency" class="form-label"
								>FREQUENTANTE</label
							>
							<select id="newFrequency" class="form-select">
								<option value="" selected></option>
								<option value="true">SÌ</option>
								<option value="false">NO</option>
							</select>
						</div>
						<button type="submit" class="btn btn-success w-25">
							INVIA
						</button>
						<button type="reset" class="btn btn-danger w-25">
							CANCELLA
						</button>
					</div>
				</div>
			</form>
			<h2>Lista iscritti</h2>
			<ul id="studentList"></ul>
		</div>
	</body>
</html>
