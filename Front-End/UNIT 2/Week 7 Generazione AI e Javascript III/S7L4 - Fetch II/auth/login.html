<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JavaScript asincrono 2</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
			crossorigin="anonymous"
		/>
		<script type="module" src="./login.js"></script>
	</head>
	<body>
		<h2>LOGIN</h2>

        <div class="container d-flex justify-content-center">
            <form>
                <input type="email" id="userEmail" placeholder="Inserisci l'email di registrazione" />
                <input type="password" id="userPass" placeholder="Inserisci la password" />
                <div class="container d-flex justify-content-center">
                    <button type="submit" class="btn btn-success" id="userLogin">Accedi</button>
                    oppure
                    <button type="button" class="btn btn-info" id="userRegister">Registrati</button>
                </div>
            </form>
        </div>
        <h2 id="loginError"></h2>

        <script
			src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
			integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
			crossorigin="anonymous"
		></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
			integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
			crossorigin="anonymous"
		></script>
    </body>

</html>
