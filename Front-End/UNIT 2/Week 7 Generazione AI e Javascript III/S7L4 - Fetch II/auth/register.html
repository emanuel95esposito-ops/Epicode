<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JavaScript asincrono 2</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
			crossorigin="anonymous"
		/>
		<script type="module" src="./register.js"></script>
	</head>
	<body>
		<h2>REGISTRATI</h2>
		<div class="container d-flex justify-content-center">
			<form>
				<div class="row">
					<div class="col-4">
						<input
							type="text"
							id="userName"
							class="form-control"
							placeholder="Inserisci il nome completo"
						/>
					</div>
					<div class="col-4">
						<input
							type="email"
							id="userEmail"
							class="form-control"
							placeholder="Inserisci l'email"
						/>
					</div>
					<div class="col-4">
						<input
							type="password"
							id="userPass"
							class="form-control"
							placeholder="Scegli una password"
						/>
					</div>
					<button type="submit" class="btn btn-success w-25">
						REGISTRATI
					</button>
				</div>
			</form>
		</div>
		<h3 id="regMessage" class="text-center"></h3>
	</body>
</html>
