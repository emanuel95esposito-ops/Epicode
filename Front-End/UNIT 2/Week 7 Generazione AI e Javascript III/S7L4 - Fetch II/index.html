<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JavaScript asincrono 2</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
			crossorigin="anonymous"
		/>
        <script type="module" src="assets/js/script.js"></script>
	</head>
	<body>
		<ul id="usersList"></ul>

		<div class="container text-center">
			<h2>REGISTRA UN UTENTE</h2>
			<form>
				<div class="row">
					<div class="col-4">
						<input
							type="text"
							id="nameUser"
							class="form-control"
							placeholder="Inserisci il nome utente"
						/>
					</div>
					<div class="col-4">
						<input
							type="text"
							id="userName"
							class="form-control"
							placeholder="Inserisci lo username scelto"
						/>
					</div>
					<div class="col-4">
						<input
							type="email"
							id="userEmail"
							class="form-control"
							placeholder="Inserisci l'email"
						/>
					</div>
				</div>
				<button type="submit" class="btn btn-success w-25">
					REGISTRA
				</button>
			</form>
		</div>

		<script
			src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
			integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
			crossorigin="anonymous"
		></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
			integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
			crossorigin="anonymous"
		></script>
	</body>
</html>
