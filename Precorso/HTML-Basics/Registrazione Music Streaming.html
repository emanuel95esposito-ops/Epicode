<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati qui! Music Streaming ti attende!</title>
</head>
<body>
    <h1>Registrazione Music Streaming</h1>
    <form onsubmit="alert('Registrazione inviata!')">
        <div>
            <input type="text" placeholder="Nome" />
        </div>
        <div>
            <input type="text" placeholder="Cognome" />
        </div>
        <div>
            <input type="email" placeholder="Indirizzo Email" />
        </div>
        <div>
            <input type="password" placeholder="Password" />
        </div>
        <div>
            <input type="date" placeholder="Data di Nascita" />
        </div>
        <div>
            <input type="number" placeholder="Numero di Telefono" />
        </div>
        <div>
            <input type="checkbox" id="pop" />
            <label for="pop">Musica Pop</label>
        </div>
        <div>
            <input type="checkbox" id="rock" />
            <label for="rock">Musica Rock</label>
        </div>
        <div>
            <input type="checkbox" id="jazz" />
            <label for="jazz">Musica Jazz</label>
        </div>
        <div>
            <input type="checkbox" id="rap" />
            <label for="rap">Musica Rap</label>
        </div>
        <div>
            <input type="checkbox" id="latina" />
            <label for="latina">Musica Latina</label>
        </div>
        <button type="submit">INVIA REGISTRAZIONE</button>
    </form>
</body>
</html>
